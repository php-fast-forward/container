name: "Fast Forward Wiki Maintenance"

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: fast-forward-wiki-writes
      cancel-in-progress: false
    # No checkout, artifact execution, PHP runtime, or PR code in privileged cleanup.
    steps:
      - name: Remove only the closed PR preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          if [[ "$state" != closed ]]; then
            echo 'The PR reopened; retain its preview.'
            exit 0
          fi
          preview="refs/heads/pr-$PR_NUMBER"
          wiki_git() { git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"; }
          remote="https://github.com/$GITHUB_REPOSITORY.wiki.git"
          existing=$(wiki_git ls-remote --heads "$remote" "$preview")
          if [[ -n "$existing" ]]; then
            git init wiki
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)
            if [[ "$state" != closed ]]; then
              echo 'The PR reopened; retain its preview.'
              exit 0
            fi
            wiki_git -C wiki push "$remote" ":$preview"
            echo "Deleted the closed PR preview $preview."
          fi
