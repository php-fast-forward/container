name: "Fast Forward Test Suite"

on:
  push:
  workflow_dispatch:
    inputs:
      publish-required-statuses:
        description: "Publish the required PHP test statuses for this run"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  tests:
    uses: php-fast-forward/dev-tools/.github/workflows/tests.yml@main
    with:
      publish-required-statuses: >-
        ${{ github.actor != 'dependabot[bot]' &&
            (github.event_name != 'workflow_dispatch' || inputs.publish-required-statuses) }}
    secrets: inherit
