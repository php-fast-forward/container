name: "Fast Forward Test Suite"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  php-changes:
    name: Detect PHP Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the PHP test scope
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # An explicit manual run always exercises the full suite.
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Feature branches retain their complete PHP diff against main,
          # so a later docs-only push cannot hide an earlier untested PHP change.
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            if ! base=$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA"); then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ] &&
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base=$BEFORE_SHA
          else
            # Missing comparison evidence must run tests, never authorize a skip.
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include additions, deletions and both sides of a rename at any depth.
          if git diff --quiet --no-renames "$base" "$GITHUB_SHA" -- '*.php'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  no-php:
    name: No PHP Changes
    needs: php-changes
    if: needs.php-changes.outputs.changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report why the test suites are unnecessary
        run: echo 'No PHP files changed; PHPUnit and production consumers are not required.'
      # Dependabot uses the existing trusted workflow_run publisher below.
      - name: Complete required test statuses without running tests
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in 8.3 8.4 8.5; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success \
              -f "context=Run Tests ($version)" \
              -f 'description=Not required: no PHP files changed.' \
              -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

  tests:
    needs: php-changes
    if: needs.php-changes.outputs.changed == 'true'
    uses: php-fast-forward/dev-tools/.github/workflows/tests.yml@main
    with:
      publish-required-statuses: ${{ github.actor != 'dependabot[bot]' }}
    secrets: inherit

  production-consumer:
    name: Production consumer (${{ matrix.php-version }}, ${{ matrix.dependencies }})
    needs: php-changes
    if: needs.php-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
        dependencies: [minimum, current]
    env:
      DEPENDENCY_SET: ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring
          tools: composer:v2
          coverage: none
      - name: Prepare isolated production and PHPUnit manifests
        env:
          CONSUMER_DIR: ${{ runner.temp }}/container-consumer-${{ matrix.dependencies }}
          HARNESS_DIR: ${{ runner.temp }}/container-phpunit-harness
        run: |
          php <<'PHP'
          <?php
          $manifest = [
              'name' => 'fast-forward/container-compatibility-test',
              'repositories' => [[
                  'type' => 'path',
                  'url' => getenv('GITHUB_WORKSPACE'),
                  'options' => ['symlink' => false, 'versions' => ['fast-forward/container' => 'dev-main']],
              ]],
              'require' => ['fast-forward/container' => 'dev-main'],
              'config' => ['allow-plugins' => false],
          ];
          $directory = getenv('CONSUMER_DIR');
          mkdir($directory, 0777, true);
          file_put_contents($directory . '/composer.json', json_encode($manifest, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT));
          $harness = [
              'name' => 'fast-forward/container-test-harness',
              'require-dev' => ['phpunit/phpunit' => '^12.5'],
              'autoload-dev' => ['psr-4' => [
                  'FastForward\\Container\\Tests\\Integration\\' => getenv('GITHUB_WORKSPACE') . '/tests/Integration/',
              ]],
              'config' => ['allow-plugins' => false],
          ];
          $harnessDirectory = getenv('HARNESS_DIR');
          mkdir($harnessDirectory, 0777, true);
          file_put_contents($harnessDirectory . '/composer.json', json_encode($harness, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT));
          PHP
          echo "CONSUMER_DIR=$CONSUMER_DIR" >> "$GITHUB_ENV"
          echo "HARNESS_DIR=$HARNESS_DIR" >> "$GITHUB_ENV"
      - name: Install only production dependencies
        run: |
          options=()
          if [ "$DEPENDENCY_SET" = minimum ]; then
            options+=(--prefer-lowest)
          fi
          composer update --working-dir="$CONSUMER_DIR" --no-plugins --no-scripts --prefer-dist --no-progress --no-interaction "${options[@]}"
          composer check-platform-reqs --working-dir="$CONSUMER_DIR" --no-dev
      - name: Install PHPUnit outside the production consumer
        run: composer update --working-dir="$HARNESS_DIR" --no-plugins --no-scripts --prefer-dist --no-progress --no-interaction
      - name: Exercise configuration, providers, autowiring and shared services
        run: |
          CONTAINER_CONSUMER_AUTOLOAD="$CONSUMER_DIR/vendor/autoload.php" php "$HARNESS_DIR/vendor/bin/phpunit" \
            --no-configuration --no-coverage --no-extensions \
            --bootstrap tests/Integration/bootstrap.php tests/Integration/ProductionConsumerTest.php
